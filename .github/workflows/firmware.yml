name: Build firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Host tests
        run: sh firmware/test/host/run.sh
      - run: pip install platformio
      - run: pio run
        working-directory: firmware
      - uses: actions/upload-artifact@v4
        with:
          name: waterrower-firmware
          path: |
            firmware/.pio/build/esp32s3/firmware.bin
            firmware/.pio/build/esp32s3/bootloader.bin
            firmware/.pio/build/esp32s3/partitions.bin
